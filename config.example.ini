[mysql]
host = localhost
user = mobile
passwd = password
db = mobile
unix_socket = /var/run/mysqld/mysqld.sock
# REON's own database, on the same server, read (never written) to honour
# a device blocked on the "connected devices" page. The user above needs
# SELECT on its sys_device_counter. Leave out and no device is ever blocked.
reon_db = reon_db

#[sqlite]
#database = users.db

# When a connection is dropped for doing nothing.
#
# Two different problems here, and they get different defaults.
#
# A socket that is *dead* -- cable pulled, console switched off, NAT
# mapping expired -- sends no FIN and no RST, so the kernel never finds
# out on its own and a read on it waits forever. Worse than the wasted
# thread: the account's number stays in the connected set, and the relay
# refuses to let that same account log in again until the process is
# restarted. Keepalive is what discovers those, and it cannot cost a live
# player anything, so it is on.
#
# A socket that is *alive but idle* is a judgement call. Someone waiting
# for a friend to call is idle on purpose, and a timeout there ends a
# session a person is actually having. Those default to 0 (off); set them
# only if you want that.
#
# The handshake is the exception that is on by default: a connection that
# has not said "MOBILE" yet is not a player, and on a port the open
# internet can reach it is usually a scanner. Without a limit there, a
# netcat that connects and says nothing holds a thread for as long as it
# likes.
#[relay]
#keepalive = yes
#keepalive_idle = 60
#keepalive_interval = 15
#keepalive_count = 4
#handshake_timeout = 15
#idle_timeout = 0
#wait_timeout = 0
#relay_timeout = 0

# Gravar o que passa entre os dois consoles.
#
# O relay é um cano: cada lado manda bytes, o outro recebe, e ninguém aqui
# interpreta nada. Com isto ligado, o que passou é guardado na ordem em que
# passou, com a hora de cada pedaço -- para poder ser convertido depois em
# outra coisa. A ideia que motivou o recurso é virar replay do Pokémon
# Stadium 2 (Kin Gin), e essa conversão NÃO existe aqui: o formato do replay
# não está documentado neste repositório, e um palpite passaria por pronto.
# O que existe é o capture_merge.py, que junta as duas metades de uma sessão
# por tempo e entrega a sequência em ordem -- a entrada de qualquer
# conversor.
#
# Um arquivo por conexão, não por partida: cada thread do relay vê só o que
# o console DELE mandou. Os dois arquivos de uma partida têm o par no nome,
# e o merge os junta.
#
# Desligado por padrão, e isso não é timidez: o arquivo é a partida de DUAS
# pessoas, não do operador. Ligar é decisão de quem administra, e quem ligar
# está guardando conversa de terceiros -- vale saber onde esses arquivos
# ficam, quem os lê e por quanto tempo existem.
#
# max_bytes é por sessão, e existe para um cliente que despeje dados sem
# parar não encher o disco: disco cheio derruba o relay para todo mundo, não
# só a gravação. Ao bater no teto, o resto da sessão não é gravado, e isso
# fica escrito no arquivo e no log -- nunca em silêncio. 0 remove o teto.
#
# `directory` precisa ser de quem RODA o serviço, e o padrão "captures" só
# serve para rodar à mão: num serviço, o processo costuma rodar como um
# usuário que não é o dono do checkout, e gravar dentro dele falha com
# Permission denied -- aparecendo como "modo ligado que não grava nada". No
# systemd o jeito limpo é StateDirectory=, que cria o diretório já com o
# dono certo; foi o que o REON usa (/var/lib/reon-captures).
#
# Além do arquivo, o painel do REON pode ligar isto pela tabela sys_settings
# (chave relay_capture, "modo torneio"), e o relay a consulta a cada sessão
# -- então ligar no site vale para a partida seguinte, sem reiniciar.
# Ligado aqui grava mesmo que o painel diga o contrário: quem tem o arquivo
# é o operador da máquina.
#[capture]
#enabled = no
#directory = /var/lib/reon-captures
#max_bytes = 1048576
